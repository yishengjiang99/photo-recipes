# XcodeGen project — generate with: brew install xcodegen && cd ios && xcodegen generate
# Or open the checked-in PhotoRecipes.xcodeproj if present.
name: PhotoRecipes
options:
  bundleIdPrefix: com.ragnus
  # Xcode 15.x on GHA macos-14 — XcodeGen 2.46 defaults to format 77 (Xcode 16)
  objectVersion: 56
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.ragnus.mvp
    DEVELOPMENT_TEAM: 83D36RPMUM
configs:
  Debug: debug
  Release: release
targets:
  PhotoRecipes:
    type: application
    platform: iOS
    sources:
      - path: PhotoRecipes
        excludes:
          - "**/*.md"
    resources:
      - path: PhotoRecipes/Resources/Assets.xcassets
      - path: PhotoRecipes/Resources/Products.storekit
    settings:
      base:
        INFOPLIST_FILE: PhotoRecipes/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ragnus.mvp
        PRODUCT_NAME: Grok Camera
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "27"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 83D36RPMUM
      configs:
        # Debug / local → development APNs; Release / Archive / TestFlight → production.
        # Hardcoding development in a distribution-signed TF build causes
        # didFailToRegisterForRemoteNotifications (no token → never POST /api/push/register).
        Debug:
          CODE_SIGN_ENTITLEMENTS: PhotoRecipes/PhotoRecipes.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: PhotoRecipes/PhotoRecipesRelease.entitlements
