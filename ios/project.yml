# XcodeGen project — generate with: brew install xcodegen && cd ios && xcodegen generate
# Or open the checked-in PhotoRecipes.xcodeproj if present.
name: PhotoRecipes
options:
  bundleIdPrefix: com.ragnus
  # Xcode 15.x on GHA macos-14 — XcodeGen 2.46 defaults to format 77 (Xcode 16)
  objectVersion: 56
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.ragnus.mvp
    DEVELOPMENT_TEAM: 83D36RPMUM
configs:
  Debug: debug
  Release: release
packages:
  FacebookSDK:
    url: https://github.com/facebook/facebook-ios-sdk
    from: "18.1.1"
targets:
  PhotoRecipes:
    type: application
    platform: iOS
    sources:
      - path: PhotoRecipes
        excludes:
          - "**/*.md"
          # PrivacyInfo + storekit must be resources only (not compiled as sources).
          # Keep Assets.xcassets in sources so XcodeGen treats it as an asset catalog
          # (excluding it and listing under resources copies the folder raw → missing
          # AppIcon / CFBundleIconName → ASC validation 409).
          - "Resources/Products.storekit"
          - "Resources/PrivacyInfo.xcprivacy"
    resources:
      - path: PhotoRecipes/Resources/Products.storekit
      - path: PhotoRecipes/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: FacebookSDK
        product: FacebookCore
    settings:
      base:
        INFOPLIST_FILE: PhotoRecipes/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ragnus.mvp
        PRODUCT_NAME: ProTune AI Camera
        PRODUCT_MODULE_NAME: PhotoRecipes
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "49"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 83D36RPMUM
        ENABLE_TESTABILITY: YES
      configs:
        # Debug / local → development APNs; Release / Archive / TestFlight → production.
        # Hardcoding development in a distribution-signed TF build causes
        # didFailToRegisterForRemoteNotifications (no token → never POST /api/push/register).
        Debug:
          CODE_SIGN_ENTITLEMENTS: PhotoRecipes/PhotoRecipes.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: PhotoRecipes/PhotoRecipesRelease.entitlements
          # Manual Distribution signing must live on the APP target only.
          # Passing PROVISIONING_PROFILE_SPECIFIER on the xcodebuild CLI applies it to
          # SPM resource bundles (Facebook_FacebookCore / Facebook_FacebookAEM), which
          # then fail with "does not support provisioning profiles" (ITMS archive).
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Grepawk Photos App Store"
  PhotoRecipesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhotoRecipesTests
    dependencies:
      - target: PhotoRecipes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ragnus.mvp.tests
        PRODUCT_NAME: PhotoRecipesTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 83D36RPMUM
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ProTune AI Camera.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ProTune AI Camera"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  PhotoRecipes:
    build:
      targets:
        PhotoRecipes: all
        PhotoRecipesTests: [test]
    test:
      targets:
        - PhotoRecipesTests

