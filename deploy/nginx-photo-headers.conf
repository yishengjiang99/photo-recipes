# Headers + compression for photo.grepawk.com STATIC locations only. Included by every static
# location (nginx does not merge server-level add_header into locations that set their own).
# Installed with the release under DEPLOY_PATH/deploy/ and referenced by nginx-photo-recipes.conf.template.
# /api/ and /.well-known/ proxies do NOT include this file, so API responses (headers included)
# are unchanged.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript text/javascript image/svg+xml application/xml text/xml application/manifest+json;
