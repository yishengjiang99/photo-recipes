<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0c0f" />
    <!-- head:start -->
    <title>ProTune AI Camera: Auto Shutter, ISO &amp; Focus for iPhone</title>
    <meta name="description" content="ProTune AI Camera for iPhone: tap Auto Optimize and it sets shutter, ISO, EV, white balance and focus for the scene. Real camera dials, no filters. Free to try." />
    <link rel="canonical" href="https://photo.grepawk.com/" />
    <!-- head:end -->
    <meta name="apple-itunes-app" content="app-id=6813991381" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-bg text-ink antialiased">
    <div id="root"></div>
    <script>
      (function () {
        var painted = false;
        function paint(msg) {
          if (painted) return;
          var root = document.getElementById('root');
          if (!root || root.dataset.booted === '1' || root.childNodes.length) return;
          painted = true;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1.5rem;background:#0c0c0f;color:#f4f4f5;font-family:system-ui,sans-serif;text-align:center">' +
            '<p style="font-size:1.25rem;font-weight:600;margin:0">ProTune AI Camera failed to load</p>' +
            '<p style="margin:0;opacity:.85;max-width:28rem;font-size:.9rem">' +
            (msg ? String(msg).slice(0, 280) : 'The app did not start.') +
            '</p>' +
            '<p style="margin:0;opacity:.7;max-width:28rem;font-size:.85rem">Clear Safari cache / try Private Tab</p>' +
            '<a href="/" style="margin-top:.5rem;padding:.5rem 1rem;border-radius:8px;background:#3b82f6;color:#fff;text-decoration:none;font-weight:600">Reload</a>' +
            '</div>';
        }
        window.addEventListener('error', function (e) {
          paint((e && (e.message || (e.error && e.error.message))) || 'Script error');
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          paint((r && (r.message || String(r))) || 'Unhandled promise rejection');
        });
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.dataset.booted !== '1' && !root.childNodes.length) {
            paint('Timed out waiting for the app to start');
          }
        }, 2000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
