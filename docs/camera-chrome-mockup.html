<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <title>Camera Chrome Mockup</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap');
    :root{
      color-scheme:light dark;
      --page:#e6e7e9; --page-ink:#17181a; --phone:#090a0b; --line:rgba(255,255,255,.19);
      --muted:rgba(255,255,255,.72); --accent:#ff6a2a; --accent-2:#ff9a5b;
      --panel:rgba(8,10,12,.69); --button:rgba(12,14,16,.68); --shadow:0 28px 70px rgba(0,0,0,.28);
    }
    @media (prefers-color-scheme:dark){:root{--page:#101113;--page-ink:#f4f4f2;--shadow:0 32px 80px rgba(0,0,0,.65)}}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Manrope,ui-sans-serif,system-ui,sans-serif;background:var(--page);color:var(--page-ink)}
    body{min-height:100svh;display:grid;place-items:center;padding:22px;overflow-x:hidden}
    button,input{font:inherit}
    button{color:inherit}
    .phone{
      position:relative;width:min(390px,calc(100vw - 28px));aspect-ratio:390/844;max-height:calc(100svh - 28px);
      border-radius:48px;background:var(--phone);padding:9px;box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.18);overflow:hidden;
    }
    .camera{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:#111;color:white;isolation:isolate}
    .scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;transition:filter .35s ease,transform .5s ease;filter:brightness(var(--exposure,1)) contrast(var(--contrast,1)) saturate(var(--saturation,1))}
    .filter-overlay{position:absolute;inset:0;pointer-events:none;z-index:1;background:rgba(255,126,55,var(--warmth,0));mix-blend-mode:soft-light;transition:background .3s}
    .look-vivid .scene{filter:brightness(var(--exposure,1)) contrast(calc(var(--contrast,1) * 1.08)) saturate(calc(var(--saturation,1) * 1.35))}
    .look-warm .filter-overlay{background:rgba(255,121,39,.20)}
    .look-mono .scene{filter:brightness(var(--exposure,1)) grayscale(1) contrast(calc(var(--contrast,1) * 1.08))}
    .look-noir .scene{filter:brightness(calc(var(--exposure,1) * .86)) grayscale(1) contrast(calc(var(--contrast,1) * 1.48))}
    .chrome{position:absolute;z-index:6;left:0;right:0;display:flex;align-items:center}
    .top{top:0;height:76px;padding:18px 16px 10px;justify-content:space-between;background:linear-gradient(#08090ad9,transparent)}
    .top-group{display:flex;align-items:center;gap:8px}
    .icon-btn{border:0;width:39px;height:39px;border-radius:50%;display:grid;place-items:center;background:var(--button);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;transition:.2s ease}
    .icon-btn:active{transform:scale(.92)}
    .icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .mic-btn.active{background:#f6f6f4;color:#171719;box-shadow:0 0 0 2px rgba(255,255,255,.24)}
    .mic-btn.active:after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:#f34d43;right:0;top:1px;box-shadow:0 0 0 3px rgba(243,77,67,.22)}
    .mic-btn{position:relative}
    .upgrade-btn{height:35px;border:0;border-radius:18px;padding:0 13px;background:linear-gradient(145deg,var(--accent-2),var(--accent));color:#1c110b;font-size:10px;font-weight:800;letter-spacing:.02em;box-shadow:0 5px 16px rgba(255,91,29,.28),inset 0 1px rgba(255,255,255,.4);cursor:pointer;transition:.2s}
    .upgrade-btn:active{transform:scale(.95)}
    .lock-pill{height:35px;border-radius:18px;padding:0 10px;display:flex;align-items:center;gap:6px;background:rgba(8,9,10,.64);backdrop-filter:blur(14px);font-size:9px;font-weight:700;letter-spacing:.06em;border:1px solid var(--line)}
    .lock-dot{width:6px;height:6px;border-radius:50%;background:#74e29a;box-shadow:0 0 0 4px rgba(116,226,154,.12)}
    .status{position:absolute;z-index:7;top:74px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(8,9,10,.62);backdrop-filter:blur(14px);padding:7px 11px;border-radius:14px;font-size:10px;font-weight:700;letter-spacing:.04em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.13);transition:.25s}
    .status.good{color:#caffd9}
    .focus{position:absolute;z-index:3;left:49%;top:44%;width:55px;height:55px;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.7);opacity:.72}
    .focus:before,.focus:after{content:"";position:absolute;background:white}
    .focus:before{width:8px;height:1px;left:23px;top:26px}.focus:after{height:8px;width:1px;left:26px;top:23px}
    .grid{position:absolute;z-index:2;inset:0;pointer-events:none;opacity:.22;background:linear-gradient(transparent 33.2%,#fff 33.3%,#fff 33.45%,transparent 33.55%,transparent 66.5%,#fff 66.6%,#fff 66.75%,transparent 66.85%),linear-gradient(90deg,transparent 33.2%,#fff 33.3%,#fff 33.45%,transparent 33.55%,transparent 66.5%,#fff 66.6%,#fff 66.75%,transparent 66.85%)}
    .filter-rail{position:absolute;z-index:7;right:11px;top:24%;display:flex;flex-direction:column;align-items:center;gap:9px}
    .filter-btn{position:relative;border:0;width:41px;height:41px;border-radius:50%;display:grid;place-items:center;background:rgba(9,10,12,.58);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;transition:.2s}
    .filter-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
    .filter-btn.active{background:#f6f6f4;color:#171719;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
    .filter-btn[data-look="warm"] svg{color:#ff9b52}.filter-btn[data-look="vivid"] svg{color:#ffce58}
    .look-tag{position:absolute;right:48px;top:50%;transform:translateY(-50%) translateX(5px);font-size:9px;font-weight:700;letter-spacing:.05em;padding:5px 8px;border-radius:10px;background:rgba(7,8,10,.68);color:white;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}
    .filter-btn.active .look-tag{opacity:1;transform:translateY(-50%) translateX(0)}
    .drawer{position:absolute;z-index:8;left:0;top:68px;bottom:145px;width:158px;padding:18px 14px 18px 16px;background:linear-gradient(90deg,rgba(6,7,8,.18),rgba(6,7,8,.06));backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px);border-right:1px solid rgba(255,255,255,.16);text-shadow:0 1px 4px rgba(0,0,0,.96);transform:translateX(-100%);transition:transform .34s cubic-bezier(.2,.8,.2,1)}
    .camera.drawer-open .drawer{transform:translateX(0)}
    .drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
    .drawer-head strong{font-size:12px}.close-drawer{border:0;background:transparent;color:white;padding:4px;cursor:pointer}
    .control{margin:0 0 20px}.control-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:9px;font-weight:700;color:var(--muted)}.control output{color:white;font-variant-numeric:tabular-nums}
    input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0}
    input[type="range"]::-webkit-slider-runnable-track{height:2px;background:rgba(255,255,255,.34);border-radius:3px}input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:white;margin-top:-7px;box-shadow:0 1px 5px #0008}
    input[type="range"]::-moz-range-track{height:2px;background:rgba(255,255,255,.34)}input[type="range"]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:white}
    .drawer-handle{position:absolute;z-index:9;left:0;top:46%;width:42px;height:92px;border:0;border-radius:0 18px 18px 0;background:rgba(8,9,11,.72);backdrop-filter:blur(14px);box-shadow:inset -1px 0 0 rgba(255,255,255,.18),0 8px 20px rgba(0,0,0,.18);display:grid;place-items:center;cursor:pointer;transition:left .34s cubic-bezier(.2,.8,.2,1)}
    .camera.drawer-open .drawer-handle{left:158px}.drawer-handle svg{width:18px;height:32px;stroke:white;transition:transform .3s}.camera.drawer-open .drawer-handle svg{transform:rotate(180deg)}
    .scan{position:absolute;z-index:4;left:8%;right:8%;height:1px;top:18%;opacity:0;background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 18px var(--accent)}
    .camera.optimizing .scan{animation:scan 1.2s ease-in-out 2;opacity:1}@keyframes scan{from{top:18%}to{top:73%}}
    .flash{position:absolute;z-index:20;inset:0;background:white;opacity:0;pointer-events:none}.flash.fire{animation:flash .38s ease-out}@keyframes flash{0%{opacity:0}20%{opacity:.92}100%{opacity:0}}
    .bottom{bottom:0;height:148px;padding:17px 14px 20px;background:linear-gradient(transparent,rgba(4,5,6,.65) 22%,rgba(4,5,6,.94));display:grid;grid-template-columns:62px 82px 1fr;gap:12px;align-items:end}
    .last-shot{width:55px;height:55px;border:0;padding:3px;border-radius:15px;background:rgba(17,18,20,.72);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);overflow:hidden;cursor:pointer;transition:.3s}.last-shot img{width:100%;height:100%;border-radius:12px;object-fit:cover;opacity:0;transform:scale(1.2);transition:.35s}.last-shot.captured img{opacity:1;transform:scale(1)}
    .last-empty{position:absolute;width:22px;height:22px;opacity:.6}.last-shot.captured .last-empty{display:none}
    .shutter{width:76px;height:76px;border-radius:50%;border:3px solid white;background:transparent;padding:5px;cursor:pointer;transition:.18s}.shutter:after{content:"";display:block;width:100%;height:100%;border-radius:50%;background:white;transition:.18s}.shutter:active{transform:scale(.94)}.shutter:active:after{transform:scale(.88)}
    .optimize{height:58px;align-self:center;border:0;border-radius:18px;padding:0 14px;background:linear-gradient(145deg,var(--accent-2),var(--accent));color:#17100b;box-shadow:0 8px 24px rgba(255,91,29,.34),inset 0 1px rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;gap:9px;font-size:11px;font-weight:800;line-height:1.15;cursor:pointer;transition:.2s;min-width:0}
    .optimize svg{width:21px;height:21px;flex:none;fill:currentColor}.optimize:active{transform:scale(.96)}.optimize.done{background:#d7ffd9;box-shadow:0 8px 24px rgba(80,214,116,.22)}
    .dictation{position:absolute;z-index:8;left:50%;bottom:140px;width:min(282px,calc(100% - 54px));height:42px;transform:translateX(-50%);display:flex;align-items:center;padding:4px 4px 4px 14px;border-radius:22px;background:rgba(7,8,10,.56);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 7px 20px rgba(0,0,0,.15);transition:.25s}
    .dictation:focus-within{background:rgba(7,8,10,.69);box-shadow:inset 0 0 0 1px rgba(255,255,255,.27),0 7px 20px rgba(0,0,0,.2)}
    .dictation input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:white;font-size:10px;font-weight:600;letter-spacing:.01em;padding:0 8px 0 0;text-overflow:ellipsis}
    .dictation input::placeholder{color:rgba(255,255,255,.62)}
    .dictation-mic{position:relative;flex:none;width:34px;height:34px;border:0;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.13);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);cursor:pointer}
    .dictation-mic svg{width:16px;height:16px;fill:none;stroke:white;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .dictation-mic.listening{background:#d8443f;animation:mic-pulse 1.1s ease-in-out infinite}
    @keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(216,68,63,.5),inset 0 0 0 1px rgba(255,255,255,.3)}50%{box-shadow:0 0 0 7px rgba(216,68,63,0),inset 0 0 0 1px rgba(255,255,255,.3)}}
    .dictation-state{position:absolute;right:12px;top:-21px;padding:4px 7px;border-radius:9px;background:rgba(7,8,10,.62);color:#d7ffd9;font-size:8px;font-weight:800;letter-spacing:.04em;opacity:0;transform:translateY(3px);transition:.2s;pointer-events:none}
    .dictation-state.show{opacity:1;transform:translateY(0)}
    .capture-count{position:absolute;z-index:7;left:17px;bottom:186px;font-size:9px;color:rgba(255,255,255,.72);opacity:0;transition:.3s}.capture-count.show{opacity:1}
    @media(max-width:430px){body{padding:0;background:#000}.phone{width:100vw;height:100svh;max-height:none;aspect-ratio:auto;border-radius:0;padding:0;box-shadow:none}.camera{border-radius:0}.top{padding-top:max(18px,env(safe-area-inset-top))}.bottom{padding-bottom:max(20px,env(safe-area-inset-bottom))}}
    @media(max-height:700px) and (min-width:431px){body{padding:10px}.phone{max-height:calc(100svh - 20px)}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>

  <script>
    (function(){
      var camera=document.getElementById('camera'), status=document.getElementById('status');
      var handle=document.querySelector('.drawer-handle'), drawer=document.querySelector('.drawer');
      function toggleDrawer(force){var open=typeof force==='boolean'?force:!camera.classList.contains('drawer-open');camera.classList.toggle('drawer-open',open);drawer.inert=!open;handle.setAttribute('aria-expanded',String(open));handle.setAttribute('aria-label',open?'Close manual controls':'Open manual controls');}
      handle.addEventListener('click',function(){toggleDrawer();});document.querySelector('.close-drawer').addEventListener('click',function(){toggleDrawer(false);});
      document.querySelectorAll('.filter-btn').forEach(function(btn){btn.addEventListener('click',function(){document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');camera.classList.remove('look-vivid','look-warm','look-mono','look-noir');if(btn.dataset.look!=='none')camera.classList.add('look-'+btn.dataset.look);status.textContent=btn.dataset.look==='none'?'EV 0.0 · 1/250 · ISO 50':btn.dataset.look.toUpperCase()+' LOOK · 1/250 · ISO 50';});});
      var microphone=document.getElementById('microphone'),dictationMic=document.getElementById('dictation-mic'),sceneText=document.getElementById('scene-text'),dictationState=document.getElementById('dictation-state');
      var partials=['golden','golden hour','golden hour portrait…','golden hour portrait… softly','golden hour portrait… softly backlit'],dictationTimer,listening=false;
      function setListening(active){listening=active;microphone.classList.toggle('active',active);dictationMic.classList.toggle('listening',active);microphone.setAttribute('aria-pressed',String(active));dictationMic.setAttribute('aria-pressed',String(active));microphone.setAttribute('aria-label',active?'Stop scene dictation':'Start scene dictation');dictationMic.setAttribute('aria-label',active?'Stop scene dictation':'Start scene dictation');}
      function finishDictation(){if(!listening)return;clearInterval(dictationTimer);setListening(false);if(!sceneText.value)sceneText.value='golden hour portrait';dictationState.textContent='Optimizing…';dictationState.classList.add('show');runOptimization(true);}
      function startDictation(){clearInterval(dictationTimer);dictationState.classList.remove('show');sceneText.value='';setListening(true);status.classList.remove('good');status.textContent='LISTENING…';var i=0;sceneText.value=partials[i++];dictationTimer=setInterval(function(){sceneText.value=partials[i++];if(i===partials.length)finishDictation();},520);}
      function toggleDictation(){if(listening)finishDictation();else startDictation();}
      microphone.addEventListener('click',toggleDictation);dictationMic.addEventListener('click',toggleDictation);
      document.getElementById('upgrade').addEventListener('click',function(){status.textContent='UPGRADE · PRO CAMERA TOOLS';});
      var controls={exposure:function(v){camera.style.setProperty('--exposure',(1+v/180).toFixed(2));return(v/50).toFixed(1);},warmth:function(v){camera.style.setProperty('--warmth',Math.max(0,v)/350);return(v>0?'+':'')+v;},tint:function(v){camera.style.setProperty('--tint',v);return(v>0?'+':'')+v;},contrast:function(v){camera.style.setProperty('--contrast',(1+v/200).toFixed(2));return(v>0?'+':'')+v;},saturation:function(v){camera.style.setProperty('--saturation',(1+v/150).toFixed(2));return(v>0?'+':'')+v;}};
      Object.keys(controls).forEach(function(id){var input=document.getElementById(id),out=document.getElementById('out-'+id);input.addEventListener('input',function(){out.textContent=controls[id](Number(input.value));status.textContent='MANUAL · '+id.toUpperCase();});});
      document.getElementById('shutter').addEventListener('click',function(){var flash=document.getElementById('flash'),shot=document.getElementById('last-shot');flash.classList.remove('fire');void flash.offsetWidth;flash.classList.add('fire');setTimeout(function(){shot.classList.add('captured');shot.setAttribute('aria-label','Open last captured photo');document.getElementById('capture-count').classList.add('show');status.textContent='PHOTO CAPTURED';},170);setTimeout(function(){status.textContent='EV 0.0 · 1/250 · ISO 50';},1350);});
      var optimize=document.getElementById('optimize'),optTimer,optDoneTimer;
      function runOptimization(fromDictation){clearTimeout(optTimer);clearTimeout(optDoneTimer);camera.classList.add('optimizing');optimize.classList.remove('done');status.classList.remove('good');status.textContent=fromDictation?'SCENE REQUEST · OPTIMIZING…':'READING LIGHT…';optTimer=setTimeout(function(){status.textContent='BALANCING COLOR…';},800);optDoneTimer=setTimeout(function(){camera.classList.remove('optimizing');optimize.classList.add('done');status.classList.add('good');status.textContent='READY · BALANCED';optimize.querySelector('span').innerHTML='Optimized';if(fromDictation){dictationState.textContent='Optimized';setTimeout(function(){dictationState.classList.remove('show');},900);}},1800);}
      optimize.addEventListener('click',function(){runOptimization(false);});
    })();
  </script>
