# Push lifecycle ops + daily monitor. Reads the cron secret ON the host (never printed) and calls
# the local API. Actions:
#   report          — GET /api/push/lifecycle/report (+ 24h-return KPI + telemetry cohort sizing)
#   monitor         — (daily schedule) evaluates the auto kill-switch guardrails, then the report.
#                     The job FAILS (GitHub notifies the owner) when the kill switch is on or a
#                     guardrail tripped.
#   dry_run_tick    — POST /api/push/lifecycle/tick, ONLY if the effective mode is dry_run
#   live_tick       — POST /api/push/lifecycle/tick, ONLY if the effective mode is live (sends real
#                     pushes to eligible users; caps/quiet hours/consent/dedupe all still apply)
#   set_env         — sets PUSH_LIFECYCLE_MODE and PUSH_EXP1_ENABLED in /etc/photo-recipes.env
#                     (backup kept), restarts photo-recipes and prints /api/health
#   kill_switch_on  — runtime kill switch: stops lifecycle AND legacy come-shoot pushes
#   kill_switch_off — clears the runtime kill switch (env PUSH_KILL_SWITCH still wins)
name: Push lifecycle report

on:
  schedule:
    - cron: '0 17 * * *'   # daily 10:00 PT (17:00 UTC during PDT)
  workflow_dispatch:
    inputs:
      action:
        description: report | monitor | dry_run_tick | live_tick | set_env | kill_switch_on | kill_switch_off
        required: true
        default: report
        type: choice
        options: [report, monitor, dry_run_tick, live_tick, set_env, kill_switch_on, kill_switch_off]
      lifecycle_mode:
        description: set_env only — PUSH_LIFECYCLE_MODE
        type: choice
        options: [unchanged, off, dry_run, allowlist, live]
        default: unchanged
      exp1_enabled:
        description: set_env only — PUSH_EXP1_ENABLED (legacy come-shoot nudges)
        type: choice
        options: [unchanged, 'false', 'true']
        default: unchanged

concurrency:
  group: push-lifecycle-ops
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          if [[ -n "${DEPLOY_SSH_KNOWN_HOSTS:-}" ]]; then printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true; fi
          chmod 600 ~/.ssh/known_hosts
      - name: Run
        env:
          ACTION: ${{ inputs.action || 'monitor' }}
          LC_MODE: ${{ inputs.lifecycle_mode || 'unchanged' }}
          EXP1: ${{ inputs.exp1_enabled || 'unchanged' }}
        run: |
          set -uo pipefail
          [[ "$LC_MODE" =~ ^(unchanged|off|dry_run|allowlist|live)$ && "$EXP1" =~ ^(unchanged|true|false)$ ]] || exit 2
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" "ACTION='$ACTION' LC_MODE='$LC_MODE' EXP1='$EXP1' bash -s" > out.json <<'REMOTE'
          set -uo pipefail
          ENV_FILE=/etc/photo-recipes.env
          BASE=http://127.0.0.1:8787
          S="$(grep -E '^PUSH_CRON_SECRET=' "$ENV_FILE" | tail -1 | cut -d= -f2- | tr -d '\r' | sed -e 's/^"//' -e 's/"$//')"
          H="X-Push-Cron-Secret: $S"
          mode() { curl -sS -m 20 "$BASE/api/health" | sed -nE 's/.*"pushLifecycle":"([a-z_]+)".*/\1/p'; }
          setkv() { # setkv KEY VALUE — replace or append, keep mode/owner
            if grep -qE "^$1=" "$ENV_FILE"; then sed -i -E "s|^$1=.*|$1=$2|" "$ENV_FILE"; else printf '%s=%s\n' "$1" "$2" >> "$ENV_FILE"; fi
          }
          if [[ "$ACTION" == set_env ]]; then
            cp -p "$ENV_FILE" "$ENV_FILE.bak-$(date -u +%Y%m%dT%H%M%SZ)" && chmod 600 "$ENV_FILE".bak-*
            [[ "$LC_MODE" != unchanged ]] && setkv PUSH_LIFECYCLE_MODE "$LC_MODE"
            [[ "$EXP1" != unchanged ]] && setkv PUSH_EXP1_ENABLED "$EXP1"
            systemctl restart photo-recipes
            for i in $(seq 1 30); do curl -sf -m 3 "$BASE/api/health" >/dev/null && break; sleep 2; done
          fi
          echo '{"health":'; curl -sS -m 20 "$BASE/api/health"; echo ','
          case "$ACTION" in
            report|set_env) ;;
            monitor) echo '"guard":'; curl -sS -m 30 -X POST -H "$H" -H 'content-type: application/json' -d '{}' "$BASE/api/push/lifecycle/guard"; echo ',' ;;
            dry_run_tick|live_tick)
              WANT="${ACTION%_tick}"; [[ "$WANT" == dry_run ]] || WANT=live
              M="$(mode)"
              if [[ "$M" != "$WANT" ]]; then echo "\"refused\":\"effective mode is '$M', not $WANT\","; else
                echo '"tick":'; curl -sS -m 600 -X POST -H "$H" -H 'content-type: application/json' -d '{}' "$BASE/api/push/lifecycle/tick"; echo ','
              fi ;;
            kill_switch_on)  echo '"ops":'; curl -sS -m 20 -X POST -H "$H" -H 'content-type: application/json' -d '{"killSwitch":true}' "$BASE/api/push/lifecycle/ops"; echo ',' ;;
            kill_switch_off) echo '"ops":'; curl -sS -m 20 -X POST -H "$H" -H 'content-type: application/json' -d '{"killSwitch":false}' "$BASE/api/push/lifecycle/ops"; echo ',' ;;
          esac
          echo '"report":'; curl -sS -m 120 -H "$H" "$BASE/api/push/lifecycle/report?days=7&kpi24h=1&cohort=1"; echo '}'
          REMOTE
          # Defensive redaction (the report never contains secrets or tokens; this is belt and braces).
          sed -E -e 's/"(secret|token|authorization|api[_-]?key|PUSH_CRON_SECRET)" *: *"[^"]*"/"\1":"[REDACTED]"/Ig' out.json > report.json
          rm -f out.json
          (jq . report.json 2>/dev/null || cat report.json)
          if jq -e . report.json >/dev/null 2>&1; then
            jq '{mode: .report.mode, killSwitch: .report.killSwitch, autoKill: .report.ops.autoKill, kpis: .report.kpis, return24h: .report.returnWithin24h, guard: (.guard // .report.guard), sentBySegment: .report.sentBySegment}' report.json > summary.json
            { echo '### Push lifecycle (ProTune)'; echo '```json'; cat summary.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            if [[ "$ACTION" == monitor ]] && jq -e '.report.killSwitch == true or (.guard.tripped == true)' report.json >/dev/null; then
              echo "::error::Push lifecycle kill switch is ON (auto guard: $(jq -r '.report.ops.autoKill.reason // .guard.reason // "manual"' report.json))"
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: push-lifecycle-report, path: report.json }
