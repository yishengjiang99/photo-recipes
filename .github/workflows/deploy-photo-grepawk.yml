# Deploy Photo Recipes web+API to https://photo.grepawk.com
#
# Required repository secret:
#   DEPLOY_SSH_KEY          — private SSH key that can SSH as DEPLOY_USER@DEPLOY_HOST
#
# Optional repository secret:
#   DEPLOY_SSH_KNOWN_HOSTS  — known_hosts lines for DEPLOY_HOST (else ssh-keyscan)
#
# Repository variables (Settings → Variables):
#   DEPLOY_HOST   = grepawk.com
#   DEPLOY_USER   = root
#   SERVER_NAME   = photo.grepawk.com
#
# See docs/deploy-github-actions.md for setup commands.
# Primary deploy path; CoS routine auto-deploy-photo-grepawk-com remains a backup
# (see docs/deploy-auto.md).

name: Deploy photo.grepawk.com

on:
  push:
    branches: [main]
    # Allowlist only — iOS / TestFlight changes (ios/**, ios-testflight.yml) do NOT deploy the site.
    paths:
      - 'src/**'
      - 'server/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'deploy/**'
      - 'deploy.sh'
      - 'index.html'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'scripts/prerender*'
      - 'scripts/api-snapshot*'
      - '.github/workflows/deploy-photo-grepawk.yml'
  workflow_dispatch:


concurrency:
  group: deploy-photo-grepawk
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: "GATE (pre-deploy): snapshot API status codes + headers"
        run: |
          set -euo pipefail
          mkdir -p deploy-gate
          bash scripts/api-snapshot.sh "https://${{ vars.SERVER_NAME }}" scripts/api-snapshot-paths.txt > deploy-gate/api-before.txt
          grep -c '^==' deploy-gate/api-before.txt

      - name: Build frontend + API
        run: npm run build

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_SSH_KEY:-}" ]]; then
            echo "DEPLOY_SSH_KEY secret is required. See docs/deploy-github-actions.md" >&2
            exit 1
          fi
          if [[ -z "${DEPLOY_HOST:-}" ]]; then
            echo "DEPLOY_HOST variable is required (e.g. grepawk.com)." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [[ -n "${DEPLOY_SSH_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi
          chmod 600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${{ vars.DEPLOY_USER }}@${DEPLOY_HOST}" 'echo ssh-ok'

      - name: Deploy via deploy.sh
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          SERVER_NAME: ${{ vars.SERVER_NAME }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?DEPLOY_HOST variable required}"
          : "${DEPLOY_USER:?DEPLOY_USER variable required}"
          : "${SERVER_NAME:?SERVER_NAME variable required}"
          chmod +x ./deploy.sh
          # Build already done above; deploy.sh rsyncs, configures nginx,
          # reinstalls certbot TLS when a cert exists, then runs smoke checks
          # (including HTML no-cache Cache-Control via nginx template).
          ./deploy.sh --skip-build

      - name: Post-deploy smoke (explicit)
        env:
          SERVER_NAME: ${{ vars.SERVER_NAME }}
        run: |
          set -euo pipefail
          BASE="https://${SERVER_NAME}"
          echo "==> curl -fI ${BASE}/"
          curl -fsSI -m 20 "${BASE}/" | head -30
          echo "==> curl -f ${BASE}/api/health"
          HEALTH="$(curl -fsS -m 20 "${BASE}/api/health")"
          echo "$HEALTH"
          echo "$HEALTH" | grep -q ok
          CC="$(curl -sSI -m 15 "${BASE}/" | tr -d '\r' | grep -i '^cache-control:' || true)"
          echo "Cache-Control: ${CC:-'(none)'}"
          echo "$CC" | grep -qi 'no-cache'

      - name: "GATE (post-deploy): API unchanged + site checks"
        env:
          SERVER_NAME: ${{ vars.SERVER_NAME }}
        run: |
          set -euo pipefail
          BASE="https://${SERVER_NAME}"
          bash scripts/api-snapshot.sh "$BASE" scripts/api-snapshot-paths.txt > deploy-gate/api-after.txt
          if diff deploy-gate/api-before.txt deploy-gate/api-after.txt; then echo "API routes: status + headers identical ($(grep -c '^==' deploy-gate/api-after.txt) paths)"; else echo "FAIL: API responses changed" >&2; exit 1; fi
          fails=0
          chk() { local got; got="$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$BASE$1")"; if [[ "$got" == "$2" ]]; then echo "ok   $1 -> $got"; else echo "FAIL $1 -> $got (want $2)"; fails=$((fails+1)); fi; }
          for p in / /privacy /terms /support /app /robots.txt /sitemap.xml /protune-og-1200x630.jpg /site.webmanifest; do chk "$p" 200; done
          chk /this-page-does-not-exist 404
          H="$(curl -s -o /dev/null -D - "$BASE/" | tr -d '\r')"
          grep -qi '^strict-transport-security: max-age=31536000' <<<"$H" && echo "ok   HSTS" || { echo "FAIL HSTS"; fails=$((fails+1)); }
          [[ "$(curl -s -o /dev/null --http2 -w '%{http_version}' "$BASE/")" == 2 ]] && echo "ok   HTTP/2" || { echo "FAIL HTTP/2"; fails=$((fails+1)); }
          HTML="$(curl -s "$BASE/")"
          [[ "$(grep -o '<h1[ >]' <<<"$HTML" | wc -l)" == 1 ]] && echo "ok   one pre-rendered <h1>" || { echo "FAIL h1 count"; fails=$((fails+1)); }
          grep -q '<link rel="canonical" href="https://photo.grepawk.com/"' <<<"$HTML" && echo "ok   canonical" || { echo "FAIL canonical"; fails=$((fails+1)); }
          JS="$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' <<<"$HTML" | head -1)"
          curl -s -o /dev/null -D - -H 'Accept-Encoding: gzip' "$BASE$JS" | tr -d '\r' | grep -qi '^content-encoding: gzip' && echo "ok   gzip $JS" || { echo "FAIL gzip"; fails=$((fails+1)); }
          curl -s -o /dev/null -D - "$BASE$JS" | tr -d '\r' | grep -qi '^cache-control: public, max-age=31536000, immutable' && echo "ok   immutable cache" || { echo "FAIL cache"; fails=$((fails+1)); }
          curl -s "$BASE/robots.txt" | grep -q '^Disallow: /api/' && echo "ok   robots disallows /api/" || { echo "FAIL robots"; fails=$((fails+1)); }
          echo "site checks: $fails failure(s)"; [[ $fails -eq 0 ]]

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-gate-${{ github.run_id }}
          path: deploy-gate/
          if-no-files-found: ignore

      - name: Post-deploy push register e2e
        if: success()
        env:
          BASE_URL: https://photo.grepawk.com
        run: npm run e2e:push
