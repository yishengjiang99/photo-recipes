name: ASC FinalCap upload listing

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout FinalCap screenshots + listing
        uses: actions/checkout@v4
        with:
          repository: yishengjiang99/finalcut
          path: finalcut

      - name: Upload App Store localization + screenshots
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_APPLE_ID: "6815060815"
        run: |
          set -euo pipefail
          pip install -q PyJWT cryptography
          python3 <<'PY'
          import json, os, time, uuid, mimetypes, pathlib, urllib.request, urllib.error
          import jwt

          key_id = os.environ["APP_STORE_CONNECT_KEY_ID"].strip()
          issuer = os.environ["APP_STORE_CONNECT_ISSUER_ID"].strip()
          p8 = os.environ["APP_STORE_CONNECT_API_KEY_P8"].replace("\\n", "\n").strip()
          apple_id = os.environ["APP_APPLE_ID"].strip()
          print("issuer", issuer)
          print("key_id", key_id)
          print("apple_id", apple_id)

          now = int(time.time())
          token = jwt.encode(
              {"iss": issuer, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"},
              p8, algorithm="ES256", headers={"kid": key_id},
          )

          def api(method, path, body=None, raw=False):
              data = None if body is None else (body if raw else json.dumps(body).encode())
              headers = {"Authorization": f"Bearer {token}"}
              if body is not None and not raw:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com" + path,
                  data=data, method=method, headers=headers,
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      raw_body = r.read().decode() or "{}"
                      return r.status, json.loads(raw_body) if raw_body else {}
              except urllib.error.HTTPError as e:
                  err = e.read().decode()
                  raise SystemExit(f"{method} {path} -> {e.code}: {err[:2500]}")

          # Resolve app by Apple ID filter or list
          st, apps = api("GET", f"/v1/apps?filter[id]={apple_id}&limit=5")
          if not apps.get("data"):
              st, apps = api("GET", "/v1/apps?limit=50")
              match = [a for a in apps.get("data", []) if a["id"] == apple_id or a["attributes"].get("bundleId") == "com.ragnus.w2"]
              if not match:
                  # print all for debug
                  for a in apps.get("data", []):
                      print("APP", a["id"], a["attributes"].get("bundleId"), a["attributes"].get("name"))
                  raise SystemExit("App not found for 6815060815 / com.ragnus.w2")
              app = match[0]
          else:
              app = apps["data"][0]
          app_id = app["id"]
          print("APP", app_id, app["attributes"].get("name"), app["attributes"].get("bundleId"))

          # Ensure iOS 1.0 version exists
          st, vers = api("GET", f"/v1/apps/{app_id}/appStoreVersions?filter[platform]=IOS&limit=20")
          version = None
          for v in vers.get("data", []):
              print("VERSION", v["id"], v["attributes"].get("versionString"), v["attributes"].get("appStoreState"))
              if v["attributes"].get("versionString") == "1.0":
                  version = v
                  break
          if version is None:
              st, created = api("POST", "/v1/appStoreVersions", {
                  "data": {
                      "type": "appStoreVersions",
                      "attributes": {
                          "platform": "IOS",
                          "versionString": "1.0",
                      },
                      "relationships": {
                          "app": {"data": {"type": "apps", "id": app_id}}
                      },
                  }
              })
              version = created["data"]
              print("created version", version["id"], version["attributes"].get("appStoreState"))
          version_id = version["id"]
          state = version["attributes"].get("appStoreState")
          print("using version", version_id, state)

          # Localization en-US
          st, locs = api("GET", f"/v1/appStoreVersions/{version_id}/appStoreVersionLocalizations")
          loc = None
          for L in locs.get("data", []):
              print("LOC", L["id"], L["attributes"].get("locale"))
              if L["attributes"].get("locale") == "en-US":
                  loc = L
          if loc is None:
              st, created = api("POST", "/v1/appStoreVersionLocalizations", {
                  "data": {
                      "type": "appStoreVersionLocalizations",
                      "attributes": {"locale": "en-US"},
                      "relationships": {
                          "appStoreVersion": {"data": {"type": "appStoreVersions", "id": version_id}}
                      },
                  }
              })
              loc = created["data"]
              print("created loc", loc["id"])
          loc_id = loc["id"]

          description = """FinalCap turns short videos into finished clips with a chat-first editor.

IMPORT
• Bring a clip from Photos
• Preview on a darkroom-style timeline

EDIT IN CHAT
• Ask for trims, captions, burns, and other server-side edits
• Watch progress while the job runs
• Preview the result before you export

CAPTIONS
• Generate captions from speech
• Translate and burn subtitles into the frame when you want them baked in

EXPORT
• Save the finished clip back to your library
• Share when you’re happy

SUBSCRIPTION
Pro unlocks via Apple In-App Purchase (StoreKit). Web billing on grepawk.com does not replace iOS IAP for in-app unlocks.

FinalCap is built by grepawk — a video editor with an AI chat loop, not a camera app."""

          keywords = "video editor,captions,subtitles,trim,AI edit,chat,export,reels,short video"
          if len(keywords) > 100:
              keywords = keywords[:100]

          st, updated = api("PATCH", f"/v1/appStoreVersionLocalizations/{loc_id}", {
              "data": {
                  "type": "appStoreVersionLocalizations",
                  "id": loc_id,
                  "attributes": {
                      "description": description,
                      "keywords": keywords,
                      "marketingUrl": "https://grepawk.com",
                      "promotionalText": "Import a clip, describe the edit in chat, preview, and export — captions, trims, and AI-assisted cuts on your iPhone. Subscribe in-app. Privacy policy on the Support site.",
                      "supportUrl": "https://grepawk.com/legal/support.html",
                      "whatsNew": "First release: import a video, edit with chat, generate/burn captions, and export. Subscription via Apple In-App Purchase.",
                  },
              }
          })
          print("localization updated", updated["data"]["attributes"].get("locale"))

          # App info localization for name/subtitle (App Store name)
          st, infos = api("GET", f"/v1/apps/{app_id}/appInfos")
          if infos.get("data"):
              info_id = infos["data"][0]["id"]
              st, info_locs = api("GET", f"/v1/appInfos/{info_id}/appInfoLocalizations")
              info_loc = None
              for L in info_locs.get("data", []):
                  if L["attributes"].get("locale") == "en-US":
                      info_loc = L
              if info_loc is None and info_locs.get("data"):
                  # create
                  st, created = api("POST", "/v1/appInfoLocalizations", {
                      "data": {
                          "type": "appInfoLocalizations",
                          "attributes": {"locale": "en-US", "name": "FinalCap - AI Video Editor", "subtitle": "AI video edit in chat"},
                          "relationships": {"appInfo": {"data": {"type": "appInfos", "id": info_id}}},
                      }
                  })
                  info_loc = created["data"]
              elif info_loc:
                  st, _ = api("PATCH", f"/v1/appInfoLocalizations/{info_loc['id']}", {
                      "data": {
                          "type": "appInfoLocalizations",
                          "id": info_loc["id"],
                          "attributes": {
                              "name": "FinalCap - AI Video Editor",
                              "subtitle": "AI video edit in chat",
                              "privacyPolicyUrl": "https://grepawk.com/legal/privacy.html",
                          },
                      }
                  })
                  print("app info localization name/subtitle updated")

          # Privacy policy URL sometimes on appInfoLocalization only — done above

          # Screenshots
          shot_dir = pathlib.Path("finalcut/assets/app-store/screenshots")
          if not shot_dir.exists():
              raise SystemExit(f"missing screenshots at {shot_dir}")

          # Display types: APP_IPHONE_67, APP_IPHONE_65
          sets = {
              "APP_IPHONE_67": sorted(shot_dir.glob("iphone67-*.png")),
              "APP_IPHONE_65": sorted(shot_dir.glob("iphone65-*.png")),
          }

          def upload_screenshot(set_id, path: pathlib.Path, sort_pos: int):
              size = path.stat().st_size
              # reserve
              st, reserved = api("POST", "/v1/appScreenshotSets/{}/appScreenshots".format(set_id) if False else "/v1/appScreenshots", {
                  "data": {
                      "type": "appScreenshots",
                      "attributes": {"fileName": path.name, "fileSize": size},
                      "relationships": {
                          "appScreenshotSet": {"data": {"type": "appScreenshotSets", "id": set_id}}
                      },
                  }
              })
              shot = reserved["data"]
              shot_id = shot["id"]
              ops = shot["attributes"].get("uploadOperations") or []
              raw = path.read_bytes()
              for op in ops:
                  url = op["url"]
                  method = op["method"]
                  headers = {h["name"]: h["value"] for h in op.get("requestHeaders", [])}
                  offset = op.get("offset", 0)
                  length = op.get("length", size)
                  chunk = raw[offset:offset+length]
                  req = urllib.request.Request(url, data=chunk, method=method, headers=headers)
                  with urllib.request.urlopen(req, timeout=120) as r:
                      r.read()
              # commit
              st, committed = api("PATCH", f"/v1/appScreenshots/{shot_id}", {
                  "data": {
                      "type": "appScreenshots",
                      "id": shot_id,
                      "attributes": {
                          "uploaded": True,
                          "sourceFileChecksum": __import__("hashlib").md5(raw).hexdigest(),
                      },
                  }
              })
              print("uploaded", path.name, "->", shot_id, committed["data"]["attributes"].get("assetDeliveryState"))

          st, existing_sets = api("GET", f"/v1/appStoreVersionLocalizations/{loc_id}/appScreenshotSets")
          by_type = {s["attributes"].get("screenshotDisplayType"): s for s in existing_sets.get("data", [])}

          for dtype, files in sets.items():
              if not files:
                  print("no files for", dtype); continue
              sset = by_type.get(dtype)
              if sset is None:
                  st, created = api("POST", "/v1/appScreenshotSets", {
                      "data": {
                          "type": "appScreenshotSets",
                          "attributes": {"screenshotDisplayType": dtype},
                          "relationships": {
                              "appStoreVersionLocalization": {
                                  "data": {"type": "appStoreVersionLocalizations", "id": loc_id}
                              }
                          },
                      }
                  })
                  sset = created["data"]
                  print("created set", dtype, sset["id"])
              else:
                  print("using set", dtype, sset["id"])
                  # delete existing screenshots to replace
                  st, shots = api("GET", f"/v1/appScreenshotSets/{sset['id']}/appScreenshots")
                  for sh in shots.get("data", []):
                      api("DELETE", f"/v1/appScreenshots/{sh['id']}")
                      print("deleted old", sh["id"])
              for i, f in enumerate(files):
                  upload_screenshot(sset["id"], f, i)

          # Category Photo & Video if editable
          print("DONE listing+screenshots for", app_id, version_id, loc_id)
          PY
