name: ASC FinalCap upload listing

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout photo-recipes (script host)
        uses: actions/checkout@v4

      - name: Checkout finalcut screenshots
        uses: actions/checkout@v4
        with:
          repository: yishengjiang99/finalcut
          path: finalcut
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload listing + screenshots to ASC
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_APPLE_ID: "6815060815"
          SHOT_DIR: finalcut/assets/app-store/screenshots
        run: |
          set -euo pipefail
          pip install -q PyJWT cryptography
          python3 .github/scripts/upload_finalcap_asc.py
