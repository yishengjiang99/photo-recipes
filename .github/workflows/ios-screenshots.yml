name: iOS App Store screenshots

# Two jobs:
#   1. store-shots — validate listing v2 frames in docs/asc/screenshots/en-US
#      (iphone-69 1320x2868, ipad-13 2064x2752) and publish them as an artifact.
#      These are the files ASC upload uses. Optional regenerate via
#      docs/asc/screenshots/en-US/make_store_screenshots.py (does not commit).
#   2. sim-shots — build PhotoRecipes for the simulator and capture a real
#      launch screenshot at App Store sizes. Artifacts only; listing frames
#      stay the generated set unless you copy them in by hand.

on:
  workflow_dispatch:
    inputs:
      regenerate:
        description: Re-run make_store_screenshots.py before validating (does not push)
        type: boolean
        default: false

jobs:
  store-shots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow / numpy if regenerating
        if: ${{ inputs.regenerate }}
        run: pip install -q pillow numpy

      - name: Regenerate listing frames
        if: ${{ inputs.regenerate }}
        run: python3 docs/asc/screenshots/en-US/make_store_screenshots.py

      - name: Check copy + PNG sizes
        run: |
          set -euo pipefail
          python3 docs/asc/check_copy.py
          python3 - <<'PY'
          import struct
          from pathlib import Path
          root = Path("docs/asc/screenshots/en-US")
          expect = {
              "iphone-69": (1320, 2868),
              "ipad-13": (2064, 2752),
          }
          missing = []
          for prefix, size in expect.items():
              files = sorted(p for p in root.glob(f"{prefix}-*.png") if p.parent == root)
              if len(files) < 5:
                  missing.append(f"{prefix}: {len(files)} files")
              for f in files:
                  w, h = struct.unpack(">II", f.read_bytes()[16:24])
                  if (w, h) != size:
                      raise SystemExit(f"{f.name} is {w}x{h}, want {size[0]}x{size[1]}")
                  print(f"ok {f.name} {w}x{h}")
          if missing:
              raise SystemExit("missing frames: " + "; ".join(missing))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots-en-US
          path: |
            docs/asc/screenshots/en-US/iphone-69-*.png
            docs/asc/screenshots/en-US/ipad-13-*.png

  sim-shots:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          for app in /Applications/Xcode_26.0.app /Applications/Xcode_26.app /Applications/Xcode_16.4.app /Applications/Xcode.app; do
            if [[ -d "$app" ]]; then sudo xcode-select -s "$app"; break; fi
          done
          xcodebuild -version

      - name: Generate Xcode project
        working-directory: ios
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          test -f PhotoRecipes.xcodeproj/project.pbxproj

      - name: Build for simulator
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ios/PhotoRecipes.xcodeproj -scheme PhotoRecipes -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.ragnus.mvp \
            > "$RUNNER_TEMP/build.log" 2>&1 || { grep -E "error:" -A3 "$RUNNER_TEMP/build.log" | head -120; tail -40 "$RUNNER_TEMP/build.log"; exit 1; }
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -name '*.app' -maxdepth 3 | head -1)
          test -d "$APP"
          echo "APP=$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Capture launch screenshots
        run: |
          set -euo pipefail
          mkdir -p shots
          xcrun simctl list devicetypes | grep -E 'iPhone 1[6-9] Pro Max|iPad Pro 13' || true
          xcrun simctl list runtimes
          RT=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"]]; print(sorted(r,key=lambda x:[int(n) for n in x["version"].split(".")])[-1]["identifier"])')
          shoot() {
            local label="$1" pattern="$2"
            local dt
            dt=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys,re; d=[x for x in json.load(sys.stdin)['devicetypes'] if re.search(r'''$pattern''', x['name'])]; print(sorted(d,key=lambda x:x['name'])[-1]['identifier'])")
            local id
            id=$(xcrun simctl create "shot-$label" "$dt" "$RT")
            xcrun simctl boot "$id"
            xcrun simctl bootstatus "$id" -b
            xcrun simctl status_bar "$id" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
            xcrun simctl install "$id" "$APP"
            xcrun simctl launch "$id" com.ragnus.mvp
            sleep 8
            xcrun simctl io "$id" screenshot "shots/${label}-01-launch.png"
            sips -g pixelWidth -g pixelHeight "shots/${label}-01-launch.png"
            xcrun simctl shutdown "$id" || true
          }
          shoot iphone-69 'iPhone 1[6-9] Pro Max'
          shoot ipad-13 'iPad Pro 13' || echo "WARN: no iPad Pro 13 simulator; skipping"
          ls -la shots

      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: shots/
