name: ASC submit App Store

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: CFBundleVersion / ASC build version (e.g. 26)
        required: false
        type: string
        default: "26"
      version_string:
        description: App Store versionString (marketing version)
        required: false
        type: string
        default: "1.0"

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Attach build and submit for review
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          VERSION_STRING: ${{ inputs.version_string }}
          BUNDLE_ID: com.ragnus.mvp
        run: |
          set -euo pipefail
          pip install -q PyJWT cryptography
          python3 <<'PY'
          import json, os, time, urllib.request, urllib.error, urllib.parse
          import jwt

          key_id = os.environ['APP_STORE_CONNECT_KEY_ID'].strip()
          issuer = os.environ['APP_STORE_CONNECT_ISSUER_ID'].strip()
          p8 = os.environ['APP_STORE_CONNECT_API_KEY_P8'].replace('\\n', '\n').strip()
          build_number = os.environ['BUILD_NUMBER'].strip()
          version_string = os.environ['VERSION_STRING'].strip()
          bundle_id = os.environ['BUNDLE_ID'].strip()

          now = int(time.time())
          token = jwt.encode(
            {'iss': issuer, 'iat': now, 'exp': now + 1200, 'aud': 'appstoreconnect-v1'},
            p8, algorithm='ES256', headers={'kid': key_id},
          )

          def api(method, path, body=None, ok_statuses=None):
            data = None if body is None else json.dumps(body).encode()
            req = urllib.request.Request(
              'https://api.appstoreconnect.apple.com' + path,
              data=data, method=method,
              headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'},
            )
            try:
              with urllib.request.urlopen(req, timeout=90) as r:
                raw = r.read().decode() or '{}'
                return r.status, json.loads(raw)
            except urllib.error.HTTPError as e:
              err = e.read().decode()
              if ok_statuses and e.code in ok_statuses:
                try:
                  parsed = json.loads(err) if err else {}
                except json.JSONDecodeError:
                  parsed = {'raw': err}
                return e.code, parsed
              raise SystemExit(f'{method} {path} -> {e.code}: {err[:2000]}')

          EDITABLE = {
            'PREPARE_FOR_SUBMISSION',
            'DEVELOPER_REJECTED',
            'REJECTED',
            'METADATA_REJECTED',
            'INVALID_BINARY',
          }
          REPLACEABLE = EDITABLE | {
            'WAITING_FOR_REVIEW',
            'IN_REVIEW',
            'PENDING_DEVELOPER_RELEASE',
          }

          print(f'=== ASC submit: bundle={bundle_id} build={build_number} versionString={version_string} ===')

          # --- App ---
          _, apps = api('GET', f'/v1/apps?filter[bundleId]={urllib.parse.quote(bundle_id)}')
          if not apps.get('data'):
            raise SystemExit(f'App not found for bundleId {bundle_id}')
          app_id = apps['data'][0]['id']
          print('app', app_id, apps['data'][0].get('attributes', {}).get('name'))

          # --- Build (must be VALID) ---
          _, builds = api(
            'GET',
            f'/v1/builds?filter[app]={app_id}&filter[version]={urllib.parse.quote(build_number)}&limit=10&sort=-uploadedDate',
          )
          match = None
          for b in builds.get('data', []):
            attrs = b.get('attributes', {})
            print('candidate build', b['id'], attrs.get('version'), attrs.get('processingState'),
                  'usesNonExemptEncryption=', attrs.get('usesNonExemptEncryption'))
            if str(attrs.get('version')) == str(build_number):
              match = b
              break
          if not match:
            raise SystemExit(f'Build {build_number} not found')
          build_id = match['id']
          battrs = match['attributes']
          if battrs.get('processingState') != 'VALID':
            raise SystemExit(
              f'Build {build_number} ({build_id}) processingState={battrs.get("processingState")} (need VALID)'
            )
          print('selected build', build_id, battrs.get('processingState'),
                'usesNonExemptEncryption=', battrs.get('usesNonExemptEncryption'))

          # Ensure export compliance cleared
          if battrs.get('usesNonExemptEncryption') is not False:
            print('clearing usesNonExemptEncryption...')
            st, updated = api('PATCH', f'/v1/builds/{build_id}', {
              'data': {
                'type': 'builds',
                'id': build_id,
                'attributes': {'usesNonExemptEncryption': False},
              }
            })
            print('patched encryption', st,
                  updated.get('data', {}).get('attributes', {}).get('usesNonExemptEncryption'))
          else:
            print('usesNonExemptEncryption already false')

          # --- App Store versions ---
          _, versions = api(
            'GET',
            f'/v1/apps/{app_id}/appStoreVersions?filter[platform]=IOS&limit=20',
          )
          version_candidates = []
          for v in versions.get('data', []):
            attrs = v.get('attributes', {})
            print('version', v['id'], attrs.get('versionString'), attrs.get('appStoreState'),
                  attrs.get('platform'))
            if attrs.get('versionString') == version_string and attrs.get('platform') == 'IOS':
              version_candidates.append(v)

          def prefer_version(cands):
            # Prefer editable, then replaceable (waiting/in review), then any match
            for state_set in (EDITABLE, REPLACEABLE):
              for v in cands:
                if v['attributes'].get('appStoreState') in state_set:
                  return v
            return cands[0] if cands else None

          version = prefer_version(version_candidates)

          if version is None:
            print(f'No IOS versionString={version_string}; creating PREPARE_FOR_SUBMISSION...')
            st, created = api('POST', '/v1/appStoreVersions', {
              'data': {
                'type': 'appStoreVersions',
                'attributes': {
                  'platform': 'IOS',
                  'versionString': version_string,
                },
                'relationships': {
                  'app': {'data': {'type': 'apps', 'id': app_id}},
                },
              }
            })
            version = created['data']
            print('created version', version['id'], version['attributes'].get('appStoreState'))
          else:
            print('using version', version['id'], version['attributes'].get('appStoreState'))

          version_id = version['id']
          vstate = version['attributes'].get('appStoreState')

          # --- Cancel/withdraw prior review submission if waiting/in review ---
          if vstate in ('WAITING_FOR_REVIEW', 'IN_REVIEW', 'PENDING_APPLE_RELEASE'):
            print(f'version state {vstate}; looking for open reviewSubmissions to cancel...')
            st, subs = api(
              'GET',
              f'/v1/apps/{app_id}/reviewSubmissions?filter[platform]=IOS&limit=20',
              ok_statuses={404, 403},
            )
            if st in (404, 403):
              # try without platform filter
              st, subs = api(
                'GET',
                f'/v1/reviewSubmissions?filter[app]={app_id}&limit=20',
                ok_statuses={404, 403},
              )
            open_states = {
              'READY_FOR_REVIEW', 'WAITING_FOR_REVIEW', 'IN_REVIEW',
              'UNRESOLVED_ISSUES', 'PENDING_DEVELOPER_RELEASE',
            }
            for s in (subs.get('data') or []):
              sattrs = s.get('attributes', {})
              sstate = sattrs.get('state')
              print('reviewSubmission', s['id'], sstate, sattrs.get('platform'))
              if sstate in open_states:
                print(f'canceling reviewSubmission {s["id"]} (state={sstate})...')
                cst, canceled = api(
                  'PATCH', f'/v1/reviewSubmissions/{s["id"]}',
                  {
                    'data': {
                      'type': 'reviewSubmissions',
                      'id': s['id'],
                      'attributes': {'canceled': True},
                    }
                  },
                  ok_statuses={409, 422},
                )
                if cst >= 400:
                  print('cancel warning', cst, json.dumps(canceled)[:800])
                else:
                  print('canceled', canceled.get('data', {}).get('attributes', {}).get('state'))
            # re-fetch version state after cancel
            time.sleep(2)
            _, vrefresh = api('GET', f'/v1/appStoreVersions/{version_id}')
            version = vrefresh['data']
            vstate = version['attributes'].get('appStoreState')
            print('version state after cancel attempt:', vstate)

          if vstate not in EDITABLE and vstate not in (
            'WAITING_FOR_REVIEW', 'IN_REVIEW', 'DEVELOPER_REJECTED',
            'REJECTED', 'METADATA_REJECTED', 'INVALID_BINARY',
            'PREPARE_FOR_SUBMISSION', 'READY_FOR_REVIEW',
          ):
            # If still locked (e.g. still WAITING), try create new version with next patch? User asked for 1.0.
            # Prefer reporting blocker rather than inventing a new versionString.
            if vstate in ('PENDING_DEVELOPER_RELEASE', 'PENDING_APPLE_RELEASE', 'PROCESSING_FOR_APP_STORE', 'READY_FOR_SALE'):
              raise SystemExit(
                f'Cannot attach/submit: appStoreVersion {version_id} is in non-editable state {vstate}. '
                f'Create a new versionString or complete prior release in ASC.'
              )

          # --- Attach build ---
          print(f'attaching build {build_id} to version {version_id}...')
          st, _ = api(
            'PATCH',
            f'/v1/appStoreVersions/{version_id}/relationships/build',
            {'data': {'type': 'builds', 'id': build_id}},
            ok_statuses={409, 422},
          )
          if st >= 400:
            # sometimes already attached — verify
            _, rel = api('GET', f'/v1/appStoreVersions/{version_id}/relationships/build')
            current = (rel.get('data') or {}).get('id')
            print('attach returned', st, 'current build rel', current)
            if current != build_id:
              # try again as hard fail with body
              st2, err2 = api(
                'PATCH',
                f'/v1/appStoreVersions/{version_id}/relationships/build',
                {'data': {'type': 'builds', 'id': build_id}},
              )
              print('retry attach', st2)
            else:
              print('build already attached')
          else:
            print('build attached', st)

          _, rel = api('GET', f'/v1/appStoreVersions/{version_id}/relationships/build')
          attached = (rel.get('data') or {}).get('id')
          print('verified attached build', attached)
          if attached != build_id:
            raise SystemExit(f'Build attach failed: expected {build_id}, got {attached}')

          # --- Submit via reviewSubmissions (prefer) ---
          def submit_via_review_submissions():
            # Reuse READY_FOR_REVIEW submission if present
            st, existing = api(
              'GET',
              f'/v1/reviewSubmissions?filter[app]={app_id}&limit=20',
              ok_statuses={403, 404},
            )
            submission_id = None
            if st < 400:
              for s in existing.get('data') or []:
                sattrs = s.get('attributes', {})
                if sattrs.get('state') == 'READY_FOR_REVIEW':
                  submission_id = s['id']
                  print('reusing READY_FOR_REVIEW submission', submission_id)
                  break

            if not submission_id:
              body = {
                'data': {
                  'type': 'reviewSubmissions',
                  'attributes': {'platform': 'IOS'},
                  'relationships': {
                    'app': {'data': {'type': 'apps', 'id': app_id}},
                  },
                }
              }
              st, created = api('POST', '/v1/reviewSubmissions', body, ok_statuses={403, 409, 422})
              if st >= 400:
                # try without platform attribute (newer API)
                body2 = {
                  'data': {
                    'type': 'reviewSubmissions',
                    'relationships': {
                      'app': {'data': {'type': 'apps', 'id': app_id}},
                    },
                  }
                }
                st, created = api('POST', '/v1/reviewSubmissions', body2, ok_statuses={403, 409, 422})
              if st >= 400:
                return False, st, created
              submission_id = created['data']['id']
              print('created reviewSubmission', submission_id, created['data'].get('attributes'))

            # Ensure version is an item
            st_items, items = api(
              'GET',
              f'/v1/reviewSubmissions/{submission_id}/reviewSubmissionItems',
              ok_statuses={404},
            )
            already = False
            if st_items < 400:
              for it in items.get('data') or []:
                # relationships may need include; check via related link if present
                print('existing item', it.get('id'), it.get('attributes'))
              # Always try POST; 409 if duplicate is fine
            st_item, item_resp = api(
              'POST', '/v1/reviewSubmissionItems',
              {
                'data': {
                  'type': 'reviewSubmissionItems',
                  'relationships': {
                    'reviewSubmission': {
                      'data': {'type': 'reviewSubmissions', 'id': submission_id},
                    },
                    'appStoreVersion': {
                      'data': {'type': 'appStoreVersions', 'id': version_id},
                    },
                  },
                }
              },
              ok_statuses={409, 422},
            )
            if st_item >= 400:
              print('reviewSubmissionItems note', st_item, json.dumps(item_resp)[:1000])
              # If conflict because already linked, continue; else may still submit
            else:
              print('added reviewSubmissionItem', item_resp.get('data', {}).get('id'))

            st_sub, submitted = api(
              'PATCH', f'/v1/reviewSubmissions/{submission_id}',
              {
                'data': {
                  'type': 'reviewSubmissions',
                  'id': submission_id,
                  'attributes': {'submitted': True},
                }
              },
              ok_statuses={409, 422, 403},
            )
            return True, st_sub, submitted if st_sub < 400 else {'submission_id': submission_id, **(submitted if isinstance(submitted, dict) else {'body': submitted})}

          def submit_via_legacy():
            st, resp = api(
              'POST', '/v1/appStoreVersionSubmissions',
              {
                'data': {
                  'type': 'appStoreVersionSubmissions',
                  'relationships': {
                    'appStoreVersion': {
                      'data': {'type': 'appStoreVersions', 'id': version_id},
                    },
                  },
                }
              },
              ok_statuses={403, 409, 422},
            )
            return st, resp

          print('=== submitting for review (reviewSubmissions) ===')
          ok, st, resp = submit_via_review_submissions()
          if not ok:
            print('reviewSubmissions create failed; trying legacy appStoreVersionSubmissions...', st, json.dumps(resp)[:1200])
            st, resp = submit_via_legacy()
            if st >= 400:
              print('ASC_ERROR_BODY', json.dumps(resp)[:2000])
              raise SystemExit(
                f'Submit blocked (legacy also failed {st}). See ASC_ERROR_BODY above.'
              )
            print('legacy submit ok', st, json.dumps(resp)[:800])
          else:
            if st >= 400:
              print('reviewSubmissions submit PATCH failed', st)
              print('ASC_ERROR_BODY', json.dumps(resp)[:2000])
              # try legacy as last resort
              print('falling back to legacy appStoreVersionSubmissions...')
              lst, lresp = submit_via_legacy()
              if lst >= 400:
                print('ASC_ERROR_BODY_LEGACY', json.dumps(lresp)[:2000])
                raise SystemExit(
                  f'Submit blocked. reviewSubmissions={st}, legacy={lst}. See ASC_ERROR_BODY.'
                )
              print('legacy submit ok', lst, json.dumps(lresp)[:800])
            else:
              sattrs = resp.get('data', {}).get('attributes', {})
              print('SUBMIT_OK submission_id=', resp.get('data', {}).get('id'),
                    'state=', sattrs.get('state'),
                    'submittedDate=', sattrs.get('submittedDate'))
              print('ASC_RESPONSE', json.dumps(resp)[:1500])

          # Final version state
          time.sleep(2)
          _, vfinal = api('GET', f'/v1/appStoreVersions/{version_id}')
          print('FINAL version', version_id,
                vfinal['data']['attributes'].get('appStoreState'),
                'versionString=', vfinal['data']['attributes'].get('versionString'))
          _, brel = api('GET', f'/v1/appStoreVersions/{version_id}/relationships/build')
          print('FINAL attached build', (brel.get('data') or {}).get('id'))
          print('SUCCESS')
          PY
