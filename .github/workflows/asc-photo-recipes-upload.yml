name: ASC Photo Recipes upload listing

# Listing prep for AI Camera - Auto Recipes (com.ragnus.mvp) version 1.0: metadata, URLs,
# categories, copyright, App Review contact, age rating, export compliance, attach build,
# screenshots from docs/asc/screenshots/en-US (listing v2), then a read-only verification.
# NEVER submits for review (that is asc-submit-app-store.yml, run by hand).

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: CFBundleVersion to attach to the version (export compliance cleared too)
        required: true
        type: string
        default: "30"
      screenshots:
        description: Replace screenshots from docs/asc/screenshots/en-US
        type: boolean
        default: true
      verify_only:
        description: Read-only verification, no writes
        type: boolean
        default: false

concurrency:
  group: asc-photo-recipes-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check listing copy + screenshot set
        run: |
          set -euo pipefail
          pip install -q numpy pillow
          python3 docs/asc/check_copy.py
          python3 - <<'PY'
          import struct
          from pathlib import Path
          root = Path("docs/asc/screenshots/en-US")
          expect = {
              "iphone-69": (1320, 2868),
              "ipad-13": (2064, 2752),
          }
          for prefix, size in expect.items():
              files = sorted(root.glob(f"{prefix}-*.png"))
              assert len(files) >= 5, f"{prefix}: expected >=5 frames, got {len(files)}"
              for f in files:
                  w, h = struct.unpack(">II", f.read_bytes()[16:24])
                  assert (w, h) == size, f"{f.name} is {w}x{h}, want {size}"
                  print("ok", f.name, w, h)
          PY

      - name: Upload listing to App Store Connect and verify
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          BUNDLE_ID: com.ragnus.mvp
          VERSION_STRING: "1.0"
          BUILD_NUMBER: ${{ inputs.build_number }}
          UPLOAD_SCREENSHOTS: ${{ inputs.screenshots }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          set -euo pipefail
          pip install -q PyJWT cryptography requests
          python3 scripts/asc/upload_photo_recipes_listing.py
