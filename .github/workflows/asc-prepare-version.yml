name: ASC prepare version (no build, never submits)

# Creates the next App Store version record (PREPARE_FOR_SUBMISSION) if missing, sets en-US
# What's New from docs/asc/metadata/en-US/whatsnew.txt, and probes the App Privacy API read-only.
# Attaching a build + full listing sync: asc-photo-recipes-upload.yml. Submitting:
# asc-submit-app-store.yml (run by the owner only).

on:
  workflow_dispatch:
    inputs:
      version_string:
        description: App Store version to create / update
        required: true
        type: string
        default: "1.2"
      dry_run:
        description: Print writes instead of doing them
        type: boolean
        default: false

concurrency:
  group: asc-photo-recipes-upload
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Create / update version record + probe App Privacy API
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          BUNDLE_ID: com.ragnus.mvp
          VERSION_STRING: ${{ inputs.version_string }}
          DRY_RUN: ${{ inputs.dry_run }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          pip install -q PyJWT cryptography requests
          python3 scripts/asc/prepare_version.py
