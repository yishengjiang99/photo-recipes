name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      notes:
        description: What Testers notes (optional)
        required: false
        default: CI build
      marketing_version:
        description: CFBundleShortVersionString (must exceed the live version; 1.1 is live)
        required: false
        default: "1.2"
      allow_missing_appsflyer:
        description: Upload even if the APPSFLYER_DEV_KEY secret is missing (AppsFlyer + ATT prompt stay off in that build)
        type: boolean
        required: false
        default: false

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-upload:
    name: Archive and upload
    runs-on: macos-15
    timeout-minutes: 75
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_PATH: ${{ github.workspace }}/private_keys/AuthKey.p8
      ARCHIVE_PATH: ${{ github.workspace }}/build/PhotoRecipes.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export
      TEAM_ID: 83D36RPMUM
      BUNDLE_ID: com.ragnus.mvp
      # AppsFlyer dev key → APPSFLYER_DEV_KEY build setting → Info.plist AppsFlyerDevKey.
      APPSFLYER_DEV_KEY: ${{ secrets.APPSFLYER_DEV_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check AppsFlyer dev key
        env:
          ALLOW_MISSING: ${{ inputs.allow_missing_appsflyer }}
        run: |
          set -euo pipefail
          if [[ -n "${APPSFLYER_DEV_KEY:-}" ]]; then
            echo "APPSFLYER_DEV_KEY present (${#APPSFLYER_DEV_KEY} chars) — AppsFlyer enabled in this build"
          elif [[ "${ALLOW_MISSING:-false}" == "true" ]]; then
            echo "::warning::APPSFLYER_DEV_KEY secret missing — AppsFlyer and the ATT prompt are disabled in this build"
          else
            echo "::error::APPSFLYER_DEV_KEY secret missing. Add it (gh secret set APPSFLYER_DEV_KEY) or re-run with allow_missing_appsflyer=true."
            exit 1
          fi

      - name: Select Xcode
        run: |
          set -euo pipefail
          # Prefer Xcode 26 (ASC SDK requirement as of 2026); fall back to 16.x
          for app in /Applications/Xcode_26.0.app /Applications/Xcode_26.app /Applications/Xcode-26.app /Applications/Xcode_16.4.app /Applications/Xcode_16.3.app /Applications/Xcode_16.2.app /Applications/Xcode_16.app /Applications/Xcode.app; do
            if [[ -d "$app" ]]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version
          ls /Applications | grep -i Xcode || true

      - name: Write ASC API key
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "${APP_STORE_CONNECT_KEY_ID:-}"
          test -n "${APP_STORE_CONNECT_ISSUER_ID:-}"
          test -n "${P8:-}"
          mkdir -p "$(dirname "$ASC_KEY_PATH")"
          printf '%s\n' "$P8" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$ASC_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"


      - name: Install Distribution cert + App Store profile
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${P12_BASE64:-}" && test -n "${P12_PASSWORD:-}" && test -n "${PROFILE_BASE64:-}"
          CERT_PATH=$RUNNER_TEMP/dist.p12
          PROFILE_PATH=$RUNNER_TEMP/appstore.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo -n "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          # Create ephemeral keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          # Profile UUID from file
          UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "Installed profile UUID=$UUID"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Generate Xcode project
        working-directory: ios
        run: |
          set -euo pipefail
          # Checked-in .xcodeproj drifts; always regenerate from project.yml
          brew install xcodegen
          xcodegen generate
          test -f PhotoRecipes.xcodeproj/project.pbxproj
          # Prefer -list; if format mismatch, fail clearly with objectVersion hint
          xcodebuild -list -project PhotoRecipes.xcodeproj

      - name: Write ExportOptions.plist
        run: |
          cat > "$GITHUB_WORKSPACE/ExportOptions.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ragnus.mvp</key>
              <string>Grepawk Photos App Store</string>
            </dict>
            <key>teamID</key>
            <string>83D36RPMUM</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          # Strip leading indentation from heredoc
          sed -i '' 's/^          //' "$GITHUB_WORKSPACE/ExportOptions.plist"
          plutil -lint "$GITHUB_WORKSPACE/ExportOptions.plist"

      - name: Archive
        working-directory: ios
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          set -o pipefail
          xcodebuild \
            -project PhotoRecipes.xcodeproj \
            -scheme PhotoRecipes \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="${{ inputs.marketing_version }}" \
            APPSFLYER_DEV_KEY="${APPSFLYER_DEV_KEY:-}" \
            archive
          # Signing (Manual + Grepawk Photos App Store) lives on the PhotoRecipes
          # Release config in ios/project.yml only. Do not pass
          # PROVISIONING_PROFILE_SPECIFIER / CODE_SIGN_STYLE on this CLI — Facebook
          # SPM resource targets inherit them and fail ("does not support provisioning profiles").
          test -d "$ARCHIVE_PATH"

      - name: Export IPA
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_PATH"
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          ls -la "$EXPORT_PATH"
          test -n "$(find "$EXPORT_PATH" -name '*.ipa' | head -1)"

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          IPA=$(find "$EXPORT_PATH" -name '*.ipa' | head -1)
          echo "Uploading $IPA (build ${{ github.run_number }}, marketing ${{ inputs.marketing_version }})"
          # altool has exited 0 while printing UPLOAD FAILED before; fail loudly on any
          # validation/upload failure marker so a bad upload never looks green.
          LOG="$RUNNER_TEMP/altool-upload.log"
          set +e
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" >"$LOG" 2>&1
          code=$?
          set -e
          cat "$LOG"
          if [ $code -ne 0 ] || grep -q "UPLOAD FAILED\|Failed to upload package\|Validation failed" "$LOG"; then
            echo "::error::altool upload failed (exit $code); see log above"
            exit 1
          fi
          echo "Upload accepted by App Store Connect"

      - name: Summary
        if: success()
        run: |
          {
            echo "### TestFlight upload"
            echo "- Bundle: \`$BUNDLE_ID\`"
            echo "- Build: \`${{ github.run_number }}\` (marketing ${{ inputs.marketing_version }})"
            if [[ -n "${APPSFLYER_DEV_KEY:-}" ]]; then echo "- AppsFlyer: enabled"; else echo "- AppsFlyer: **disabled** (no APPSFLYER_DEV_KEY)"; fi
            echo "- Notes: ${{ github.event.inputs.notes }}"
            echo "- Wait a few minutes in App Store Connect for processing, then assign testers."
          } >> "$GITHUB_STEP_SUMMARY"
