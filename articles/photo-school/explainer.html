<style>
/* Layout: a camera viewfinder "player" (canvas scenes + HUD), story-style segment bar, caption, chapter list. Single committed dark look. */
.pse{
  --ink:#0E0F11; --panel:#17191D; --line:#2A2E35; --fg:#ECE8DF; --dim:#8D9099;
  --amber:#FFB627; --red:#FF5A4E; --cool:#6EA8FF;
  --display:"Archivo","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
.pse{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;border:1px solid var(--line);border-radius:14px}
.pse *,.pse *::before,.pse *::after{box-sizing:border-box}
.pse-wrap{padding:16px;display:grid;gap:18px}
.pse .stage{position:relative;border-radius:10px;overflow:hidden;background:#000;border:1px solid var(--line)}
.pse canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;max-width:100%;cursor:pointer}
.pse .bar{display:flex;gap:12px;align-items:center}
.pse .btn{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
.pse .btn.play{width:48px;height:48px;background:var(--amber);color:var(--ink);border-color:var(--amber)}
.pse .btn:focus-visible,.pse .seg:focus-visible,.pse .chap button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.pse .btn svg{width:18px;height:18px;fill:currentColor}
.pse .segs{display:flex;gap:4px;flex:1;min-width:0}
.pse .seg{flex-basis:0;min-width:0;height:24px;border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:center}
.pse .seg span{display:block;width:100%;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.pse .seg i{display:block;height:100%;width:0;background:var(--amber)}
.pse .time{font-family:var(--mono);font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;flex:none}
.pse .caption{display:grid;gap:4px;min-height:7.5em}
.pse .caption .n{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--amber)}
.pse .caption .pse-ct{font-family:var(--display);font-stretch:75%;font-weight:700;font-size:clamp(24px,4.4vw,34px);line-height:1.05;margin:0;text-wrap:balance}
.pse .caption p{margin:2px 0 0;max-width:68ch;font-size:16px}
.pse .chaps .pse-ch{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:500;margin:10px 0 8px}
.pse .chap{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 18px}
.pse .chap button{width:100%;display:flex;gap:12px;align-items:baseline;background:none;border:0;border-top:1px solid var(--line);color:var(--fg);font:inherit;text-align:left;padding:10px 0;cursor:pointer}
.pse .chap button .k{font-family:var(--mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;flex:none;width:2.2em}
.pse .chap button .t{flex:1;min-width:0}
.pse .chap button .d{font-family:var(--mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.pse .chap button[aria-current="true"] .t{color:var(--amber)}
.pse .chap button[aria-current="true"] .k{color:var(--amber)}
@media (max-width:520px){.pse .time{display:none}.pse .btn.step{display:none}}

.pse canvas:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.pse button{-webkit-tap-highlight-color:transparent}
.pse .seg{min-width:24px}
.pse .btn.snd[aria-pressed="false"]{color:var(--amber);border-color:var(--amber)}
@media (max-width:520px){.pse .bar{flex-wrap:wrap}.pse .segs{order:3;flex-basis:100%;gap:3px}.pse .time{display:block;margin-left:auto}}

<script>
/* The player starts when it comes near the viewport (after the page has painted); its markup above is already final,
   so nothing shifts. On phones it sits below the fold, so the page's first paint never waits for it. */
(()=>{let go=false;const el0=document.getElementById('pse');
const io0=new IntersectionObserver(es=>{if(!go&&es.some(e=>e.isIntersecting)){go=true;io0.disconnect();setTimeout(run,0)}},{rootMargin:'300px 0px'});
io0.observe(el0);
function run(){
const cv=document.getElementById('pse-cv'), c=cv.getContext('2d');
const W=960,H=540;
const dpr=Math.min(2,window.devicePixelRatio||1);
cv.width=W*dpr; cv.height=H*dpr; c.setTransform(dpr,0,0,dpr,0,0);
const root=document.getElementById('pse');const cs=getComputedStyle(root);
const K=n=>cs.getPropertyValue('--'+n).trim();
const C={ink:K('ink'),panel:K('panel'),line:K('line'),fg:K('fg'),dim:K('dim'),amber:K('amber'),red:K('red'),cool:K('cool')};

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
const D=Math.PI/180;
function mono(sz,w=500){c.font=`${w} ${sz}px "IBM Plex Mono", ui-monospace, Menlo, monospace`}
function txt(s,x,y,col,al='left'){c.fillStyle=col;c.textAlign=al;c.fillText(s,x,y)}
function rng(seed){return()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){return Math.sqrt(-2*Math.log(r()+1e-9))*Math.cos(2*Math.PI*r())}
function rr(x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function bg(col=C.ink){c.fillStyle=col;c.fillRect(0,0,W,H)}
function brackets(cx,cy,w,h,len,col,lw=3){
  const x0=cx-w/2,x1=cx+w/2,y0=cy-h/2,y1=cy+h/2;c.strokeStyle=col;c.lineWidth=lw;c.lineCap='square';c.beginPath();
  c.moveTo(x0,y0+len);c.lineTo(x0,y0);c.lineTo(x0+len,y0);
  c.moveTo(x1-len,y0);c.lineTo(x1,y0);c.lineTo(x1,y0+len);
  c.moveTo(x1,y1-len);c.lineTo(x1,y1);c.lineTo(x1-len,y1);
  c.moveTo(x0+len,y1);c.lineTo(x0,y1);c.lineTo(x0,y1-len);c.stroke();
}
function rgb(r,g,b){return `rgb(${Math.round(clamp(r)*255)},${Math.round(clamp(g)*255)},${Math.round(clamp(b)*255)})`}

/* ---------- shared landscape image (for tone + WB scenes) ---------- */
const LW=240,LH=135,N=LW*LH;
const LR=new Float32Array(N),LG=new Float32Array(N),LB=new Float32Array(N);
(()=>{const r=rng(3);for(let y=0;y<LH;y++)for(let x=0;x<LW;x++){
  const u=x/LW,v=y/LH,i=y*LW+x;let R,G,B;
  const ridge=.52+.07*Math.sin(u*8+1)+.04*Math.sin(u*21);
  const sun=Math.max(0,1-Math.hypot(u-.72,(v-.3)*1.8)*4);
  if(v<ridge){const t=v/ridge;R=lerp(.30,.97,t);G=lerp(.46,.76,t);B=lerp(.74,.52,t);R+=sun*.6;G+=sun*.5;B+=sun*.3}
  else if(v<.78){const t=(v-ridge)/(.78-ridge);R=lerp(.30,.10,t);G=lerp(.33,.14,t);B=lerp(.38,.13,t);R+=(r()-.5)*.04;G+=(r()-.5)*.04}
  else{const t=(v-.78)/.22;R=lerp(.55,.16,t);G=lerp(.50,.18,t);B=lerp(.52,.22,t);if(Math.abs(u-.72+Math.sin(v*90)*.006)<.025){R+=.45;G+=.35;B+=.2}}
  LR[i]=clamp(R);LG[i]=clamp(G);LB[i]=clamp(B);
}})();
const off=document.createElement('canvas');off.width=LW;off.height=LH;
const octx=off.getContext('2d');const img=octx.createImageData(LW,LH);
const IDL=new Uint8ClampedArray(256).map((_,i)=>i);
function paintLand(lut,mr=1,mg=1,mb=1){const d=img.data;for(let i=0,j=0;i<N;i++,j+=4){
  d[j]=lut[Math.min(255,LR[i]*mr*255|0)];d[j+1]=lut[Math.min(255,LG[i]*mg*255|0)];d[j+2]=lut[Math.min(255,LB[i]*mb*255|0)];d[j+3]=255}
  octx.putImageData(img,0,0)}

/* ---------- scenes ---------- */
function s1(p,s){
  bg();const cx=480,cy=255,R=130;
  c.fillStyle=C.panel;c.beginPath();c.arc(cx,cy,R,0,7);c.fill();
  const open=52+28*Math.sin(s*1.4),rot=s*.25,pts=[];
  for(let k=0;k<6;k++){const a=rot+k*Math.PI/3;pts.push([cx+Math.cos(a)*open,cy+Math.sin(a)*open])}
  c.save();c.beginPath();c.arc(cx,cy,R,0,7);c.clip();
  c.strokeStyle=C.line;c.lineWidth=2;
  for(let k=0;k<6;k++){const a=pts[k],b=pts[(k+5)%6];const dx=a[0]-b[0],dy=a[1]-b[1],L=Math.hypot(dx,dy);
    c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(a[0]+dx/L*260,a[1]+dy/L*260);c.stroke()}
  c.fillStyle=C.ink;c.beginPath();pts.forEach((q,k)=>k?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.closePath();c.fill();
  c.restore();
  c.strokeStyle=C.dim;c.lineWidth=3;c.beginPath();c.arc(cx,cy,R,0,7);c.stroke();
  const f=lerp(400,300,ease(clamp(s/1.4)));
  brackets(cx,cy,f,f*.78,30,C.amber,3);
  c.strokeStyle=C.amber;c.lineWidth=2;c.beginPath();c.moveTo(cx-10,cy);c.lineTo(cx+10,cy);c.moveTo(cx,cy-10);c.lineTo(cx,cy+10);c.stroke();
  mono(22);txt('f/1.78   1/120   ISO 64   5600K',cx,478,C.dim,'center');
}

function s2(p,s){
  bg();const v=.5-.5*Math.cos(2*Math.PI*p);
  const T=Math.exp(lerp(Math.log(1/2000),Math.log(1/15),v));const iso=Math.max(32,Math.round(1.6/T));
  c.fillStyle=C.panel;rr(40,80,420,300,8);c.fill();rr(500,80,420,300,8);c.fill();
  mono(18);txt('MOTION BLUR',58,110,C.dim);txt('NOISE',518,110,C.dim);
  const pcx=250,pcy=240,w=22,ang=s*w,span=w*T,Nn=28;
  c.lineCap='round';c.lineWidth=16;c.strokeStyle=C.fg;
  for(let j=0;j<Nn;j++){const a=ang-span*j/(Nn-1);c.globalAlpha=Math.min(1,1.6/Nn*(span<.05?Nn/1.6:1));
    for(let b=0;b<3;b++){const t=a+b*2*Math.PI/3;c.beginPath();c.moveTo(pcx,pcy);c.lineTo(pcx+Math.cos(t)*110,pcy+Math.sin(t)*110);c.stroke()}}
  c.globalAlpha=1;c.fillStyle=C.amber;c.beginPath();c.arc(pcx,pcy,14,0,7);c.fill();
  c.save();rr(500,80,420,300,8);c.clip();
  const g=c.createRadialGradient(690,215,10,710,240,90);g.addColorStop(0,'#c9c3b6');g.addColorStop(1,'#3b3e45');
  c.fillStyle=g;c.beginPath();c.arc(710,240,86,0,7);c.fill();
  const r=rng(Math.floor(s*24)+1),n=Math.round(60+iso/3200*2600);
  for(let i=0;i<n;i++){c.fillStyle=`rgba(${80+r()*175|0},${80+r()*175|0},${80+r()*175|0},.55)`;c.fillRect(500+r()*420,80+r()*300,2.5,2.5)}
  c.restore();
  mono(26,600);txt('1/'+Math.round(1/T),40,428,C.fg);txt('ISO '+iso,920,428,C.fg,'right');
  mono(20);txt('f/1.78 · FIXED',480,428,C.dim,'center');
  c.strokeStyle=C.line;c.lineWidth=4;c.beginPath();c.moveTo(120,456);c.lineTo(840,456);c.stroke();
  const kx=lerp(120,840,v);c.strokeStyle=C.amber;c.beginPath();c.moveTo(120,456);c.lineTo(kx,456);c.stroke();
  c.fillStyle=C.amber;c.beginPath();c.arc(kx,456,10,0,7);c.fill();
  mono(18);txt('frozen motion',120,490,C.dim);txt('clean pixels',840,490,C.dim,'right');
}

function s3(p,s){
  const k=sstep(.35,.62,p),g=lerp(.55,1.65,k);
  c.fillStyle=rgb(.9*g,.93*g,.98*g);c.fillRect(0,0,W,H);
  const m=clamp(.28*g);c.fillStyle=rgb(m,m,m);
  c.fillRect(296,0,18,H);c.fillRect(656,0,18,H);c.fillRect(0,196,W,14);
  const fl=clamp(.32*g);
  c.fillStyle=rgb(fl*.82,fl*.7,fl*.62);c.beginPath();c.ellipse(480,590,250,190,0,Math.PI,2*Math.PI);c.fill();
  c.fillRect(452,320,56,90);
  c.fillStyle=rgb(fl,fl*.86,fl*.74);c.beginPath();c.ellipse(480,262,80,98,0,0,7);c.fill();
  const fa=sstep(.15,.28,p);
  if(fa>0){c.globalAlpha=fa;brackets(480,262,230,262,28,C.amber,3);
    c.fillStyle='rgba(14,15,17,.8)';rr(366,104,108,30,4);c.fill();mono(18,600);txt('FACE',378,126,C.amber);c.globalAlpha=1}
  c.fillStyle='rgba(14,15,17,.84)';rr(40,80,300,118,8);c.fill();
  mono(18);txt('METERING',58,112,C.dim);
  mono(26,600);txt(k<.5?'AVERAGE':'FACE-WEIGHTED',58,148,C.fg);
  mono(20);txt('face luma '+fl.toFixed(2),58,180,fl<.2?C.red:C.amber);
  if(k>.7){c.globalAlpha=sstep(.7,.9,p);c.fillStyle='rgba(14,15,17,.84)';rr(560,430,360,46,8);c.fill();
    mono(18);txt('window clips · that is fine',580,460,C.fg);c.globalAlpha=1}
}

const HB=(()=>{const r=rng(7),a=[];for(let i=0;i<6000;i++){const q=r();
  let v=q<.55?.28+gauss(r)*.11:q<.85?.64+gauss(r)*.07:.88+gauss(r)*.04;a.push(clamp(v,0,.999))}return a})();
function s4(p,s){
  bg();const e=.04+.24*Math.sin(2*Math.PI*p),B=60,cnt=new Array(B).fill(0);let clip=0,crush=0;
  for(const v of HB){const y=v+e;if(y>=1){cnt[B-1]++;clip++}else if(y<0){cnt[0]++;crush++}else cnt[Math.floor(y*B)]++}
  const x0=80,x1=880,y1=400,h=290,bw=(x1-x0)/B,scale=h/340;
  for(let i=0;i<B;i++){let bh=Math.min(h,cnt[i]*scale);
    c.fillStyle=i===B-1&&clip>0?C.red:i===0&&crush>0?C.cool:C.fg;c.globalAlpha=i===B-1||i===0?1:.82;
    c.fillRect(x0+i*bw+1,y1-bh,bw-2,bh)}
  c.globalAlpha=1;
  c.strokeStyle=C.line;c.lineWidth=2;c.beginPath();c.moveTo(x0,y1);c.lineTo(x1,y1);c.stroke();
  const gr=c.createLinearGradient(x0,0,x1,0);gr.addColorStop(0,'#000');gr.addColorStop(1,'#fff');c.fillStyle=gr;c.fillRect(x0,408,x1-x0,12);
  mono(18);txt('0',x0,442,C.dim);txt('255',x1,442,C.dim,'right');
  const ev=e*4;mono(24,600);txt('EV '+(ev>=0?'+':'−')+Math.abs(ev).toFixed(1),x0,96,C.fg);
  const cp=clip/HB.length*100,kp=crush/HB.length*100;mono(19);
  if(cp>.3)txt(`CLIPPED ${cp.toFixed(1)}% · gone for good`,x1,96,C.red,'right');
  if(kp>.3)txt(`CRUSHED ${kp.toFixed(1)}% · liftable, adds noise`,x0,478,C.cool);
}

function crv(x,t1,t2){const S=x-.08*Math.sin(2*Math.PI*x),F=.08+.84*(x-.05*Math.sin(2*Math.PI*x));return(1-t1)*x+t1*((1-t2)*S+t2*F)}
const LUT=new Uint8ClampedArray(256);
function s5(p,s){
  bg();const t1=sstep(.05,.3,p),t2=sstep(.45,.7,p);
  for(let i=0;i<256;i++)LUT[i]=clamp(crv(i/255,t1,t2))*255;
  const bx=60,by=100,bs=340;
  c.fillStyle=C.panel;c.fillRect(bx,by,bs,bs);

function setSnd(){sbtn.setAttribute('aria-pressed',snd?'true':'false');sbtn.setAttribute('aria-label',snd?'Mute narration':'Turn narration on');
  sico.innerHTML=snd?'<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/>':'<path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3l2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/>'}
function ensureAu(){if(au||!AU_SRC)return;au=new Audio();au.preload='auto';au.src=AU_SRC;
  au.addEventListener('loadedmetadata',()=>{au.currentTime=el;syncAu()});
  au.addEventListener('waiting',()=>{buf=true});['playing','canplaythrough','seeked','pause'].forEach(e=>au.addEventListener(e,()=>{buf=false}));
  au.addEventListener('error',()=>{au=null;snd=false;setSnd()})}
function syncAu(){if(!au)return;const want=snd&&playing&&vis;
  if(want){if(au.readyState>0&&!au.seeking&&Math.abs(au.currentTime-el)>.25)au.currentTime=el;if(au.paused){const q=au.play();if(q)q.catch(()=>{})}}
  else if(!au.paused)au.pause()}
function soundOn(){snd=true;ensureAu();setSnd()}
sbtn.addEventListener('click',()=>{tapped=true;if(snd)snd=false,setSnd();else soundOn();syncAu();kick()});
function setBtn(){pbtn.setAttribute('aria-label',playing?'Pause':'Play');pico.innerHTML=playing?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4l13 8-13 8z"/>'}
function toggle(){auto=false;if(!playing&&el>=total-0.01)el=0;playing=!playing;dirty=true;setBtn();if(playing&&!tapped){tapped=true;soundOn()}syncAu();kick()}
function jump(i){el=ST[(i+SC.length)%SC.length];dirty=true;if(au&&au.readyState>0)au.currentTime=el;syncAu();kick()}
function idx(){let i=0;while(i<SC.length-1&&el>=ST[i+1])i++;return i}
pbtn.addEventListener('click',toggle);cv.addEventListener('click',toggle);
document.getElementById('pse-prev').addEventListener('click',()=>{const i=idx();jump(el-ST[i]>1.5?i:Math.max(0,i-1))});
document.getElementById('pse-next').addEventListener('click',()=>jump(Math.min(SC.length-1,idx()+1)));
root.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button'))return;
  if(e.key===' '){e.preventDefault();toggle()}else if(e.key==='ArrowRight')jump(Math.min(SC.length-1,idx()+1));else if(e.key==='ArrowLeft')jump(Math.max(0,idx()-1))});

function render(){
  const i=idx(),loc=el-ST[i],p=clamp(loc/SC[i].d);
  c.save();SC[i].f(p,loc);c.restore();
  if(loc<.35&&playing){c.fillStyle=C.ink;c.globalAlpha=1-loc/.35;c.fillRect(0,0,W,H);c.globalAlpha=1}
  c.lineCap='butt';hud(i,el);
  fills.forEach((f,j)=>f.style.width=(j<i?100:j>i?0:p*100)+'%');
  tm.textContent=fmt(el)+' / '+fmt(total);
  if(i!==cur){cur=i;document.getElementById('pse-cn').textContent=String(i+1).padStart(2,'0')+' / '+SC.length;
    document.getElementById('pse-ct').textContent=SC[i].t;document.getElementById('pse-cb').textContent=SC[i].b;
    cbtn.forEach((b,j)=>b.setAttribute('aria-current',j===i?'true':'false'))}
}
function frame(ts){
  raf=0;const dt=last==null?0:Math.min(.1,(ts-last)/1000);last=ts;
  if(playing){
    if(snd&&au&&vis&&(buf||au.readyState<2)){/* hold the animation while the narration buffers */}
    else if(snd&&au&&vis&&!au.paused&&!au.seeking&&Math.abs(au.currentTime-el)<.5)el=au.currentTime;
    else el+=dt;
    if(el>=total){el=total-0.001;playing=false;setBtn()}dirty=true}
  if(dirty){render();dirty=false}
  syncAu();
  if(vis)raf=requestAnimationFrame(frame);
}
function kick(){if(!raf){last=null;raf=requestAnimationFrame(frame)}}
/* Page embed: autoplay (unless reduced motion) once the canvas is in view; the frame loop stops while the
   whole player is off screen (playback holds its place) and resumes when it scrolls back. */
new IntersectionObserver(es=>{vis=es[es.length-1].isIntersecting;syncAu();if(vis)kick()}).observe(root);
const aio=new IntersectionObserver(es=>{if(auto&&es[es.length-1].isIntersecting){auto=false;aio.disconnect();if(!playing){playing=true;setBtn();kick()}}},{threshold:.35});
if(auto)aio.observe(cv);
/* The player's own fonts load after the page has loaded (off the critical path); the canvas redraws once they arrive. */
function loadFonts(){const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap';
  l.onload=()=>{Promise.all(['500 17px "IBM Plex Mono"','600 26px "IBM Plex Mono"','700 30px Archivo','400 16px "IBM Plex Sans"'].map(f=>document.fonts.load(f))).then(()=>{dirty=true;kick()},()=>{})};
  document.head.appendChild(l)}
if(document.readyState==='complete')setTimeout(loadFonts,0);else addEventListener('load',()=>setTimeout(loadFonts,0));
setBtn();setSnd();render();
root.pse={get t(){return el},get playing(){return playing},get audio(){return au},get sound(){return snd}}; /* read-only hook for tests */
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{dirty=true;kick()});
}
})();
</script>
